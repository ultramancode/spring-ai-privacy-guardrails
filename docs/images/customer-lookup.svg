<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="624" viewBox="0 0 1120 624" role="img" aria-labelledby="title desc">
  <title id="title">Values passed through a customer lookup</title>
  <desc id="desc">The model receives tokens for the customer ID and email. The lookup tool receives only the original customer ID. The result is protected again, while delivery status and arrival information remain available for the answer.</desc>
  <!-- Reconstructed from recorded customer requests used in presentation scenes 01–03.
       Text, colors and values follow those scenes. This is an editable diagram, not an application screenshot. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #192943; }
    .label { font-size: 16px; fill: #61738c; }
    .heading { font-size: 23px; font-weight: 700; }
    .body { font-size: 20px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 21px; }
    .token { fill: #2459d6; }
    .original { fill: #16804b; }
    .note { font-size: 17px; fill: #4c6079; }
  </style>
  <rect x="1" y="1" width="1118" height="622" rx="18" fill="#f7faff" stroke="#dce5ef"/>
  <rect x="24" y="24" width="1072" height="88" rx="10" fill="#fff" stroke="#dce5ef"/>
    <text x="44" y="51" class="label" >CUSTOMER REQUEST</text>
    <text x="44" y="86" class="mono" >CUST-1042  ·  minsu@example.com</text>
    <text x="590" y="86" class="body" >Please check my delivery status.</text>
  <g>
    <rect x="24" y="148" width="340" height="324" rx="12" fill="#fff" stroke="#bfd0f7" stroke-width="1.5"/>
    <path d="M36 148H352Q364 148 364 160V207H24V160Q24 148 36 148Z" fill="#eef4ff"/>
    <text x="44" y="185" class="mono" style="fill:#2459d6;font-weight:700">01</text>
    <text x="90" y="185" class="heading" >Model input</text>
    <text x="44" y="242" class="label" >Customer ID</text>
    <text x="44" y="272" class="mono token" >[CUSTOMER_ID_1]</text>
    <text x="44" y="311" class="label" >Email</text>
    <text x="44" y="341" class="mono token" >[EMAIL_ADDRESS_1]</text>
    <path d="M44 365H344" stroke="#e2e9f2"/>
    <text x="44" y="402" class="note" >Both originals stay tokenized</text>
    <text x="44" y="433" class="note" >The model calls a tool with tokens</text>
  </g>
  <path d="M370 307h14m-5-5 5 5-5 5" fill="none" stroke="#6884bd" stroke-width="2"/>
  <g>
    <rect x="390" y="148" width="340" height="324" rx="12" fill="#fff" stroke="#9ed8b5" stroke-width="1.5"/>
    <path d="M402 148H718Q730 148 730 160V207H390V160Q390 148 402 148Z" fill="#edf9f2"/>
    <text x="410" y="185" class="mono" style="fill:#16804b;font-weight:700">02</text>
    <text x="456" y="185" class="heading" >Tool input</text>
    <text x="410" y="242" class="label" >Customer ID</text>
    <text x="410" y="272" class="mono original" >CUST-1042</text>
    <text x="410" y="311" class="label" >Email</text>
    <text x="410" y="341" class="mono token" >[EMAIL_ADDRESS_1]</text>
    <path d="M410 365H710" stroke="#e2e9f2"/>
    <text x="410" y="402" class="mono" >customerLookup</text>
    <text x="410" y="433" class="note" >Only the customer ID is restored</text>
  </g>
  <path d="M736 307h14m-5-5 5 5-5 5" fill="none" stroke="#6884bd" stroke-width="2"/>
  <g>
    <rect x="756" y="148" width="340" height="324" rx="12" fill="#fff" stroke="#bfd0f7" stroke-width="1.5"/>
    <path d="M768 148H1084Q1096 148 1096 160V207H756V160Q756 148 768 148Z" fill="#eef4ff"/>
    <text x="776" y="185" class="mono" style="fill:#2459d6;font-weight:700">03</text>
    <text x="822" y="185" class="heading" >Result sent to model</text>
    <text x="776" y="242" class="label" >Customer ID</text>
    <text x="776" y="272" class="mono token" >[CUSTOMER_ID_1]</text>
    <text x="776" y="311" class="label" >Email</text>
    <text x="776" y="341" class="mono token" >[EMAIL_ADDRESS_1]</text>
    <path d="M776 365H1076" stroke="#e2e9f2"/>
    <text x="776" y="402" class="body original" >In transit</text>
    <text x="776" y="433" class="body original" >Arrival: next business day</text>
  </g>
  <rect x="24" y="496" width="1072" height="86" rx="10" fill="#edf9f2" stroke="#c7e8d5"/>
    <text x="44" y="523" class="label" style="fill:#16804b">ANSWER DELIVERED TO THE CUSTOMER</text>
    <text x="44" y="558" class="body" >Your delivery is in transit and is expected to arrive the next business day.</text>
    <text x="24" y="607" class="label" style="font-size:15px">Tokens abbreviated for readability</text>
</svg>
