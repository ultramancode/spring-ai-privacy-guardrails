description = 'Dedicated HTTP content inspection with explicit guard-model protocols.'
dependencies {
    api project(':spring-ai-privacy-guardrails-inspection-core')
    api "com.openai:openai-java:${providers.gradleProperty('openAiJavaVersion').get()}"
}

tasks.named('test') { useJUnitPlatform { excludeTags 'live' } }
tasks.register('liveTest', Test) {
    description = 'Runs Kanana classification checks against a configured live model server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    outputs.upToDateWhen { false }
}
