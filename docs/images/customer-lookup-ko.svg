    .heading { font-size: 23px; font-weight: 700; }
    .body { font-size: 20px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 21px; }
    .token { fill: #2459d6; }
    .original { fill: #16804b; }
    .note { font-size: 17px; fill: #4c6079; }
  </style>
  <rect x="1" y="1" width="1118" height="622" rx="18" fill="#f7faff" stroke="#dce5ef"/>
