plugins {
    id 'privacy.repository-verification'
    id 'privacy.release'
}

privacyBuild {
    module('spring-ai-privacy-guardrails-core') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.core',
                'Spring AI Privacy Guardrails Core'
        )
        module.denyAllExternalMainDependencies()
        module.springIndependentPublication()
    }

    module('spring-ai-privacy-guardrails-opennlp') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.opennlp',
                'Spring AI Privacy Guardrails OpenNLP Adapter'
        )
        module.dependsOnProject 'spring-ai-privacy-guardrails-core'
        module.denyExternalGroup 'org.springframework'
        module.springIndependentPublication()
    }

    module('spring-ai-privacy-guardrails-opennlp-spring-boot-starter') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.opennlp.autoconfigure',
                'Spring AI Privacy Guardrails OpenNLP Spring Boot Starter'
        )
        module.dependsOnProject(
                'spring-ai-privacy-guardrails-opennlp',
                'spring-ai-privacy-guardrails-spring-boot-starter'
        )
    }

    module('spring-ai-privacy-guardrails-presidio') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.presidio',
                'Spring AI Privacy Guardrails Presidio Adapter'
        )
        module.dependsOnProject 'spring-ai-privacy-guardrails-core'
        module.denyExternalGroup 'org.springframework'
        module.springIndependentPublication()
    }

    module('spring-ai-privacy-guardrails-presidio-spring-boot-starter') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.presidio.autoconfigure',
                'Spring AI Privacy Guardrails Presidio Spring Boot Starter'
        )
        module.dependsOnProject(
                'spring-ai-privacy-guardrails-presidio',
                'spring-ai-privacy-guardrails-spring-boot-starter'
        )
    }

    module('spring-ai-privacy-guardrails-spring-ai') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.springai',
                'Spring AI Privacy Guardrails Spring AI Integration'
        )
        module.dependsOnProject 'spring-ai-privacy-guardrails-core'
        module.denyExternalGroup 'org.springframework.boot'
    }

    module('spring-ai-privacy-guardrails-spring-boot-starter') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.autoconfigure',
                'Spring AI Privacy Guardrails Spring Boot Starter'
        )
        module.dependsOnProject(
                'spring-ai-privacy-guardrails-core',
                'spring-ai-privacy-guardrails-spring-ai'
        )
    }

    module('spring-ai-privacy-guardrails-test') { module ->
        module.publication(
                'io.github.ultramancode.springai.privacy.test',
                'Spring AI Privacy Guardrails Test Support'
        )
        module.dependsOnProject 'spring-ai-privacy-guardrails-spring-ai'
    }

    module('spring-ai-privacy-guardrails-benchmarks') { module ->
        module.dependsOnProject(
                'spring-ai-privacy-guardrails-core',
                'spring-ai-privacy-guardrails-spring-ai'
        )
    }

    module('spring-ai-privacy-guardrails-sample-demo') { module ->
        module.dependsOnProject(
                'spring-ai-privacy-guardrails-opennlp-spring-boot-starter',
                'spring-ai-privacy-guardrails-presidio-spring-boot-starter',
                'spring-ai-privacy-guardrails-spring-boot-starter'
        )
    }

    localizedDocument 'README.md', 'README.ko.md'
    localizedDocument 'docs/architecture.md', 'docs/ko/architecture.md'
    localizedDocument 'docs/configuration.md', 'docs/ko/configuration.md'
    localizedDocument 'docs/evaluation.md', 'docs/ko/evaluation.md'
    localizedDocument 'docs/threat-model.md', 'docs/ko/threat-model.md'
}
