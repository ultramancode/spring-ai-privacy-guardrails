server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: spring-ai-privacy-guardrails-demo
  ai:
    privacy:
      enabled: true
      output:
        enabled: true
        action: tokenize
      analysis:
        language: ko
        minimum-score: 0.5
      tools:
        disclosures:
          customerLookup:
            - CUSTOMER_ID
      regex:
        enabled: true
        # Prefer explicit ASCII boundaries to \b for ASCII-oriented rules,
        # so behavior stays consistent across supported JDKs.
        rules:
          - entity-type: EMAIL_ADDRESS
            pattern: '(?<![A-Za-z0-9_])(?=[A-Za-z0-9_])[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?![A-Za-z0-9_])'
            score: 0.95
          - entity-type: PHONE_NUMBER
            pattern: '(?<![A-Za-z0-9_])01[016789]-[0-9]{3,4}-[0-9]{4}(?![A-Za-z0-9_])'
            score: 0.95
          - entity-type: KOREAN_RRN
            pattern: '(?<![A-Za-z0-9_])[0-9]{6}-[1-4][0-9]{6}(?![A-Za-z0-9_])'
            score: 0.9
          - entity-type: EMPLOYEE_ID
            pattern: '(?<![A-Za-z0-9_])EMP-[0-9]{4}(?![A-Za-z0-9_])'
            score: 0.9
          - entity-type: CUSTOMER_ID
            pattern: '(?<![A-Za-z0-9_])CUST-[0-9]{6}(?![A-Za-z0-9_])'
            score: 0.9

---
spring:
  config:
    activate:
      on-profile: presidio
  ai:
    privacy:
      analysis:
        language: en
        provider-minimum-scores:
          PRESIDIO: 0.8
        entity-aliases:
          US_SSN: NATIONAL_ID
      presidio:
        enabled: true
        analyzer-url: http://localhost:5002

---
spring:
  config:
    activate:
      on-profile: opennlp
  ai:
    privacy:
      analysis:
        language: en
        provider-minimum-scores:
          OPENNLP: 0.8
      opennlp:
        enabled: true
        tokenizer-model: ${OPENNLP_TOKENIZER_MODEL}
        entity-models:
          PERSON: ${OPENNLP_PERSON_MODEL}
