server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: spring-ai-privacy-guardrails-demo
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: privacy-demo-crm
        version: 1.0.0
        tool-callback-converter: false
        capabilities:
          resource: false
          prompt: false
          completion: false
    privacy:
      analysis:
        language: ko
        minimum-score: 0.5
      rules:
        enabled: true
        presets: [COMMON, KR]
        include: [employee-id, customer-id]

---
spring:
  config:
    activate:
      on-profile: presidio
  ai:
    privacy:
      analysis:
        language: en
        provider-minimum-scores:
          PRESIDIO: 0.8
        entity-aliases:
          US_SSN: NATIONAL_ID
      presidio:
        enabled: true
        analyzer-url: http://localhost:5002

---
spring:
  config:
    activate:
      on-profile: opennlp
  ai:
    privacy:
      analysis:
        language: en
        provider-minimum-scores:
          OPENNLP: 0.8
      opennlp:
        enabled: true
        tokenizer-model: ${OPENNLP_TOKENIZER_MODEL}
        entity-models:
          PERSON: ${OPENNLP_PERSON_MODEL}
