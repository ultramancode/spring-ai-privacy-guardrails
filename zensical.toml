[project]
site_name = "Spring AI Privacy Guardrails"
site_url = "https://ultramancode.github.io/spring-ai-privacy-guardrails/"
site_description = "Request-scoped PII tokenization and least-privilege disclosure across Spring AI model and tool calls."
site_author = "Taewoong Kim"
copyright = """
Copyright © 2026 Taewoong Kim · <a href="#__consent">Change cookie settings</a>
"""
repo_url = "https://github.com/ultramancode/spring-ai-privacy-guardrails"
edit_uri = "edit/main/docs/"
strict = true
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/consent.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Reference" = [
    { "Sample / Demo Guide" = "sample.md" },
    { "Configuration" = "configuration.md" },
    { "Architecture" = "architecture.md" },
    { "Threat Model" = "threat-model.md" },
    { "Evaluation" = "evaluation.md" },
  ] },
  { "한국어" = [
    { "홈" = "ko/index.md" },
    { "시작하기" = "ko/getting-started.md" },
    { "샘플 / 데모 가이드" = "ko/sample.md" },
    { "설정과 사용법" = "ko/configuration.md" },
    { "아키텍처" = "ko/architecture.md" },
    { "위협 모델" = "ko/threat-model.md" },
    { "평가 및 벤치마크" = "ko/evaluation.md" },
  ] },
]

[project.extra]
generator = false

[project.extra.analytics]
provider = "google"
property = "G-TRDLMR5WD8"

[project.extra.consent]
title = "Privacy settings"
description = """
Optional third-party services help us understand how the documentation is used
and display repository metadata. You can reject them without affecting access
to the documentation.
"""
actions = ["accept", "reject", "manage"]

[project.extra.consent.cookies.analytics]
name = "Google Analytics"
checked = true

[project.extra.consent.cookies.clarity]
name = "Microsoft Clarity"
checked = true

[project.extra.consent.cookies.github]
name = "GitHub"
checked = true

[project.theme]
language = "en"
font = false
logo = "images/privacy-mark.svg"
favicon = "images/privacy-mark.png"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.betterem"]

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.keys"]

[project.markdown_extensions."pymdownx.magiclink"]

[project.markdown_extensions."pymdownx.mark"]

[project.markdown_extensions."pymdownx.smartsymbols"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions."pymdownx.tilde"]
