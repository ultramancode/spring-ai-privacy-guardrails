<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="624" viewBox="0 0 1120 624" role="img" aria-labelledby="title desc">
  <title id="title">고객 조회 과정에서 전달되는 값</title>
  <desc id="desc">고객번호와 이메일을 모델에는 토큰으로 전달합니다. 고객 조회 도구에는 고객번호만 복원합니다. 조회 결과는 다시 보호하고 배송 상태와 도착 예정일로 답변합니다.</desc>
